<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Clicker</title>
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>

    <div class="game-layout">
        <!-- Left Side (Main game window) -->
        <div class="main-area">
            <h1>Emojis: <span id="emoji_count">0</span></h1>
            <h2 id="generating_label" class="hidden">
                Generating: <span id="generating_rate">0</span> E/s
            </h2>
            <div id="emoji-button">🌳</div>
        </div>

        <!-- Right Side (Upgrades window) -->
        <div class="shop-area">
            <div class="tabs">
                <button id="tab_up" class="active">🏭 Buildings</button>
                <button id="tab_res">🃏 Cards</button>
            </div>

            <!-- Section 1: Upgrades -->
            <div id="view_up" class="shop_content">
                <!-- Upgrade 1 (Always Visible) -->
                <div class="upgrade_card" role="button" tabindex="0" id="card_starter">
                    <div class="card_icon">🌳</div>
                    <div class="card_info">
                        <p class="card_price"></p>
                        <div class="level_display"></div>
                    </div>
                </div>

                <!-- Upgrade 2 (Hidden until 100 total) -->
                <div class="upgrade_card hidden" role="button" tabindex="0" id="card_laugher">
                    <div class="card_icon">🏔️</div>
                    <div class="card_info">
                        <p class="card_price"></p>
                        <div class="level_display"></div>
                    </div>
                </div>

                <!-- Upgrade 3 (Hidden until 2000 total) -->
                <div class="upgrade_card hidden" role="button" tabindex="0" id="card_crying">
                    <div class="card_icon">🧱</div>
                    <div class="card_info">
                        <p class="card_price"></p>
                        <div class="level_display"></div>
                    </div>
                </div>

            </div>

            <!-- Section 2: Research -->
            <div id="view_res" class="shop_content hidden">
                Research Content
            </div>
        </div>
        
        <!-- CardBox button -->
        <button id="open-modal" class="circle-btn" aria-label="Open menu">📦</button>
        <div id="modal-overlay" class="modal hidden">
            <div class="modal-content">
                <button id="close-modal" aria-label="Close menu">❌</button>
                    <!-- Cards go here -->
                <p>Custom modal text placeholder</p>
            </div>
        </div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
