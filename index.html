<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Clicker</title>
    <link rel="stylesheet" href="public/css/style.css">
</head>
<body>

    <div class="game-layout">
        <!-- Left Side -->
        <div class="main-area">
            <h1>Emojis: <span id="emoji_count">0</span></h1>
            <div id="emoji-button">😃</div>
        </div>

        <!-- Right Side -->
        <div class="shop-area">
            <div class="tabs">
                <button id="tab_up" class="active">Upgrades</button>
                <button id="tab_res">Research</button>
            </div>

            <!-- Section 1: Upgrades -->
            <div id="view_up" class="shop_content">
                <!-- Upgrade 1 (Always Visible) -->
                <div class="upgrade_card" id="card_starter">
                    <div class="card_icon">😊</div>
                    <div class="card_info">
                        <p class="card_title"></p>
                        <div class="level_display"></div>
                    </div>
                    <button id="btn_buy_starter" class="buy_button">9 Emojis</button>
                </div>

                <!-- Upgrade 2 (Hidden until 100 total) -->
                <div class="upgrade_card hidden" id="card_laugher">
                    <div class="card_icon">😂</div>
                    <div class="card_info">
                        <p class="card_title">Laughing Joy</p>
                        <div class="level_display"></div>
                        <p class="card_price">163 Emojis</p>
                    </div>
                    <button id="btn_buy_laugher" class="buy_button">Buy</button>
                </div>

                <!-- Upgrade 3 (Hidden until 2000 total) -->
                <div class="upgrade_card hidden" id="card_crying">
                    <div class="card_icon">😢</div>
                    <div class="card_info">
                        <p class="card_title">Crying Face</p>
                        <div class="level_display"></div>
                        <p class="card_price">2781 Emojis</p>
                    </div>
                    <button id="btn_buy_crying" class="buy_button">Buy</button>
                </div>

            </div>

            <!-- Section 2: Research -->
            <div id="view_res" class="shop_content hidden">
                Research Content
            </div>
        </div>
    </div>

    <script type="module" src="src/app.js"></script>
</body>
</html>
